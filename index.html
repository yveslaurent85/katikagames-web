
<!DOCTYPE html>
<html>
<head>
  <base href="/jouer/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120b20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Katika">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Katika – Ludo et Dés</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #120b20;
    }
    #katika-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at center, #302047 0%, #120b20 72%);
      color: #fffaf0;
      font-family: Arial, Helvetica, sans-serif;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #katika-loading img {
      width: 112px;
      height: 112px;
      object-fit: contain;
      border-radius: 24px;
    }
    #katika-loading p {
      margin: 0;
      color: #edc66d;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .katika-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(237, 198, 109, .25);
      border-top-color: #edc66d;
      border-radius: 50%;
      animation: katika-spin .8s linear infinite;
    }
    @keyframes katika-spin {
      to { transform: rotate(360deg); }
    }
    #katika-loading.katika-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('katika-loading');
      if (loading) {
        loading.classList.add('katika-hidden');
        window.setTimeout(function () {
          loading.remove();
        }, 400);
      }
    });
  </script>
</head>
<body>
  <div id="katika-loading" role="status">
    <img src="../icon-192.png" alt="Logo Katika">
    <p>Katika – Ludo et Dés</p>
    <div class="katika-spinner"></div>
    <span style="color:#c7bad9;font-size:13px;">
      Préparation de votre partie…
    </span>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
