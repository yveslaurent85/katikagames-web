<style>html,body{margin:0;height:100%;background:#061A66}#kt-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#061A66;transition:opacity .35s ease}#kt-splash img{width:120px;height:120px;border-radius:26px;box-shadow:0 8px 28px rgba(0,0,0,.45)}#kt-splash b{margin-top:18px;font:800 30px/1 system-ui,sans-serif;color:#fff;letter-spacing:.5px}#kt-splash b i{font-style:normal;color:#FFC21A}#kt-splash u{margin-top:26px;width:34px;height:34px;border:4px solid rgba(255,255,255,.25);border-top-color:#FFC21A;border-radius:50%;animation:kts .8s linear infinite}@keyframes kts{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div id="kt-splash"><img src="/icon-192.png" alt="" onerror="this.style.display='none'"><b>Kati<i>ka</i></b><u></u></div>
<script>window.addEventListener("flutter-first-frame",function(){var s=document.getElementById("kt-splash");if(!s)return;s.style.opacity="0";setTimeout(function(){s.remove()},400)});</script>
