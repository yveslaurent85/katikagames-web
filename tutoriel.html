<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tutoriel Katika</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="tutoriel.css">
</head><body>


<header>
  <h1>Katika <span>Tutoriel</span></h1>
  <p class="sub">Choisis une leçon. Chaque étape a une capture de l'application, une voix et un texte. Touche « Suivant » pour avancer.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<main>
  <div class="steplabel" id="label"></div>
  <h2 class="steptitle" id="title"></h2>
  <div class="shot"><img id="img" alt="Capture de l'application Katika"><div class="zone" id="zone"></div></div>
  <p class="hint" id="hint">La voix est celle de ton téléphone. Les montants affichés sont ceux de la capture.</p>
</main>
<div class="bar"><div>
  <div class="dotsrow" id="dots"></div>
  <p class="cap" id="cap" aria-live="polite"></p>
  <div class="ctl">
    <button class="ghost" id="prev" aria-label="Étape précédente">←</button>
    <button class="ghost" id="replay" aria-label="Réécouter">🔊</button>
    <button class="btn" id="next">Suivant →</button>
  </div>
</div></div>

<script src="tutoriel.js"></script>
</body></html>
