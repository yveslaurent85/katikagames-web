<title>Tutoriel Katika</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;600&display=swap">
<style>
/* Mise en page : titre + onglets, capture réelle de l'appli avec zone jaune pulsante, barre de légende fixe avec bouton Suivant. Look sombre assumé, bleu nuit et or. */
:root{
  --bg:#07124a; --ink:#f4f6ff; --mute:#aab6e8; --gold:#ffc21a; --line:#2a3da0;
  --display:'Outfit','Trebuchet MS',sans-serif; --body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 200px}
header,main{max-width:760px;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,38px);margin:4px 0 2px}
h1 span{color:var(--gold)}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 150px;min-width:0;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:10px 12px;font:600 15px var(--body);cursor:pointer;text-align:left}
.tab small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.tab[aria-selected=true]{background:var(--gold);border-color:var(--gold);color:#1a1300}
.tab[aria-selected=true] small{color:#4a3900}
.tab:focus-visible,.btn:focus-visible,.ghost:focus-visible{outline:3px solid #fff;outline-offset:2px}
main{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.steplabel{font-family:var(--display);font-weight:600;color:var(--gold);letter-spacing:1px;text-transform:uppercase;font-size:13px;text-align:center}
.steptitle{font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,26px);margin:0;text-align:center;text-wrap:balance}
.shot{position:relative;width:min(300px,80vw);border-radius:28px;overflow:hidden;box-shadow:0 0 0 6px #05091f,0 0 0 8px #3a4cb8,0 18px 40px rgba(0,0,0,.45);background:#05091f;line-height:0}
.shot img{width:100%;height:auto;display:block}
.zone{position:absolute;border:4px solid var(--gold);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,20,.35);animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{border-color:#fff}}
@media (prefers-reduced-motion:reduce){.zone{animation:none}}
.bar{position:fixed;left:0;right:0;bottom:0;background:#030a33;border-top:2px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.bar>div{max-width:760px;margin:0 auto}
.cap{font-size:clamp(16px,4.2vw,19px);line-height:1.4;margin:0 0 10px;min-height:4.2em}
.ctl{display:flex;gap:8px;align-items:center}
.btn{flex:1;border:0;border-radius:14px;padding:14px;background:var(--gold);color:#1a1300;font:800 18px var(--display);cursor:pointer}
.ghost{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:12px 14px;font:600 15px var(--body);cursor:pointer;min-width:48px}
.dotsrow{display:flex;gap:6px;justify-content:center;margin:0 0 10px;flex-wrap:wrap}
.dotsrow i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dotsrow i.d{background:var(--gold)}
.hint{color:var(--mute);font-size:12px;text-align:center;max-width:46ch;margin:0}
</style>

<header>
  <h1>Katika <span>Tutoriel</span></h1>
  <p class="sub">Choisis une leçon. Chaque étape a une capture de l'application, une voix et un texte. Touche « Suivant » pour avancer.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<main>
  <div class="steplabel" id="label"></div>
  <h2 class="steptitle" id="title"></h2>
  <div class="shot"><img id="img" alt="Capture de l'application Katika"><div class="zone" id="zone"></div></div>
  <p class="hint" id="hint">La voix est celle de ton téléphone. Les montants affichés sont ceux de la capture.</p>
</main>
<div class="bar"><div>
  <div class="dotsrow" id="dots"></div>
  <p class="cap" id="cap" aria-live="polite"></p>
  <div class="ctl">
    <button class="ghost" id="prev" aria-label="Étape précédente">←</button>
    <button class="ghost" id="replay" aria-label="Réécouter">🔊</button>
    <button class="btn" id="next">Suivant →</button>
  </div>
</div></div>
